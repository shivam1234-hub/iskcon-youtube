<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>YouTube</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: Roboto, "Segoe UI", Arial, sans-serif; color: #fff; user-select: none; }
  #bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 10px;
    background: #181818; -webkit-app-region: drag; }
  #title { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e8e8e8; }
  button { -webkit-app-region: no-drag; background: transparent; border: 0; color: #fff; width: 30px; height: 26px;
    border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  button:hover { background: #ffffff22; }
  button.close:hover { background: #e81123; }
  svg { width: 16px; height: 16px; fill: currentColor; }
  #stage { position: absolute; top: 30px; left: 0; right: 0; bottom: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div id="bar">
  <div id="title"></div>
  <button id="play" title="Play / pause (k)"><svg viewBox="0 0 24 24"><path id="playIcon" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
  <button id="back" title="Back to the app"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg></button>
  <button id="close" class="close" title="Close"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
</div>
<div id="stage"></div>
<script>
  // The mini player: YouTube's own embed, hosted from the app's loopback
  // origin so it has the referrer the embed requires.
  var q = new URLSearchParams(location.search);
  var v = q.get('v') || '';
  var t = parseInt(q.get('t') || '0', 10) || 0;
  var title = q.get('title') || '';
  document.getElementById('title').textContent = title;
  document.title = title ? title + ' - YouTube' : 'YouTube';
  var d = window.desktop;
  var src = 'https://www.youtube.com/embed/' + encodeURIComponent(v) +
    '?playsinline=1&rel=0&fs=1&enablejsapi=1&autoplay=1' + (t > 0 ? '&start=' + t : '') +
    '&origin=' + encodeURIComponent(location.origin);
  var f = document.createElement('iframe');
  f.src = src;
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  document.getElementById('stage').appendChild(f);

  var playing = true;
  function cmd(func, args) {
    try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [], id: 1, channel: 'widget' }), '*'); } catch (e) {}
  }
  function listen() {
    try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (e) {}
  }
  f.addEventListener('load', function () { listen(); setTimeout(listen, 500); setTimeout(listen, 1500); });
  function setIcon() {
    document.getElementById('playIcon').setAttribute('d', playing ? 'M6 5h4v14H6zM14 5h4v14h-4z' : 'M8 5v14l11-7z');
  }
  var lastSent = -1;
  window.addEventListener('message', function (e) {
    if (e.source !== f.contentWindow) return;
    var m;
    try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    if (!m || !m.info) return;
    var st = m.info.playerState;
    if (st === 1) { playing = true; setIcon(); d && d.float.report({ playing: true }); }
    else if (st === 2) { playing = false; setIcon(); d && d.float.report({ playing: false }); }
    else if (st === 0) { playing = false; setIcon(); d && d.float.report({ playing: false, ended: true }); }
    var ct = m.info.currentTime;
    if (typeof ct === 'number' && Math.abs(ct - lastSent) >= 1) { lastSent = ct; d && d.float.report({ time: Math.floor(ct) }); }
  });
  function toggle() { if (playing) cmd('pauseVideo'); else cmd('playVideo'); playing = !playing; setIcon(); }
  document.getElementById('play').onclick = toggle;
  document.getElementById('back').onclick = function () { d ? d.float.backToApp() : window.close(); };
  document.getElementById('close').onclick = function () { window.close(); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'k' || e.key === ' ') { e.preventDefault(); toggle(); }
    if (e.key === 'Escape') window.close();
  });
  if (d) d.media.onKey(function (k) {
    if (k === 'playPause') toggle();
    else if (k === 'pause') { cmd('pauseVideo'); playing = false; setIcon(); }
  });
</script>
</body>
</html>
